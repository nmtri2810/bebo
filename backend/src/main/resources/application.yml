spring:
  config:
    import: optional:file:../.env[.properties]

  application:
    name: bebo-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/bebo}
    username: ${DATABASE_USERNAME:bebo}
    password: ${DATABASE_PASSWORD:bebo}

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        jdbc:
          "[time_zone]": UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      probes:
        enabled: true

bebo:
  jwt:
    issuer: ${JWT_ISSUER:bebo-backend}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT24H}
    secret: ${JWT_SECRET:YmViby1kZXYtc2VjcmV0LW11c3QtYmUtYXQtbGVhc3QtMzItYnl0ZXM=}

  cors:
    allowed-origins:
      - ${FRONTEND_URL:http://localhost:3000}

  telegram:
    enabled: ${TELEGRAM_BOT_ENABLED:false}
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    bot-username: ${TELEGRAM_BOT_USERNAME:}
    connection-token-ttl: 10m
    poll-delay-ms: 3000

  reminder:
    enabled: ${REMINDER_SCHEDULER_ENABLED:true}
    cron: "${REMINDER_SCHEDULER_CRON:0 * * * * *}"

    retry-cron: "${REMINDER_RETRY_CRON:15 * * * * *}"
    retry-batch-size: ${REMINDER_RETRY_BATCH_SIZE:100}

    first-retry-delay: ${REMINDER_FIRST_RETRY_DELAY:PT5M}
    second-retry-delay: ${REMINDER_SECOND_RETRY_DELAY:PT15M}
    third-retry-delay: ${REMINDER_THIRD_RETRY_DELAY:PT30M}

    max-overdue-days: ${REMINDER_MAX_OVERDUE_DAYS:14}
